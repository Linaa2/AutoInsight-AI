[project]
name = "autoinsight-ai"
version = "1.0.0"
description = "An AI agent that analyzes datasets and generates actionable insights in a user-friendly manner."
authors = [
  { name = "ELAMINE Mohammed", email = "elamine.mohammed.14@gmail.com" },
  { name = "RHIATI HAZIME Lina", email = "lina.rhiati2@gmail.com" },
  { name = "BOUTROUFT Younes", email = "bft.younes@gmail.com" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

dependencies = [
    # Orchestration
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    # LLMs
    "langchain-google-genai>=1.0.0",
    "ollama>=0.2.0",
    # Monitoring
    "langfuse>=4.0.0",
    # Memory
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    # Data
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    # Visualization
    "plotly>=5.20.0",
    # UI
    "streamlit>=1.35.0",
    "streamlit-lottie>=0.0.5",
    # Monitoring / Telemetry
    "psutil>=5.9.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.3.0",
    "langchain-ollama>=1.0.1",
    "streamlit-flow-component>=1.6.1",
    "langchain-groq>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.2",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "app",
    "config",
    "evaluation",
    "graph",
    "orchestration",
    "tools",
    "utils",
    "visualization",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without explicit strict
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
mypy_path = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "app*", "config*", "evaluation*", "graph*", "tools*", "utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: quick sanity-check tests that verify a module is importable and callable",
    "integration: tests that require external services (Ollama, network)",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]

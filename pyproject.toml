[project]
name = "autoinsight-ai"
version = "1.0.0"
description = "Système multi-agent d'analyse de données"
requires-python = ">=3.10"

dependencies = [
    # Orchestration
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",

    # LLMs
    "langchain-google-genai>=1.0.0",
    "ollama>=0.2.0",

    # Monitoring
    "langfuse>=2.0.0",

    # Mémoire
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",

    # Data
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",

    # Visualisation
    "plotly>=5.20.0",

    # UI
    "streamlit>=1.35.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
# docker-compose.langfuse.yml — Self-hosted LangFuse v3 for AutoInsight AI
# ─────────────────────────────────────────────────────────────────────────
# ✅ FULLY AUTOMATED — no manual account creation needed.
#
# Usage (recommended — auto-generates credentials on first run):
#   make langfuse-up           # start (generates .env.langfuse if missing)
#   make langfuse-down         # stop
#   make langfuse-reset        # destroy data + rotate credentials
#
# How it works
# ─────────────────────────────────────────────────────────────────────────
# `scripts/setup_langfuse.py` generates .env.langfuse once (idempotent).
# That file contains:
#   • LANGFUSE_INIT_* variables to seed the org/project/user/API keys
#   • shared runtime secrets (NEXTAUTH_SECRET, SALT, ENCRYPTION_KEY, REDIS_AUTH)
# The same project public/secret keys are also synced into the repo `.env`
# so the Python app can connect automatically.
#
# LangFuse v3 architecture
# ─────────────────────────────────────────────────────────────────────────
# LangFuse v3 is not a single-process web app anymore. OTEL traces are:
#   Python SDK → LangFuse web API → Redis queue → LangFuse worker → ClickHouse
# So a reliable local stack needs:
#   • langfuse-web     — UI + public/private HTTP API
#   • langfuse-worker  — consumes the OTEL ingestion queue
#   • PostgreSQL       — relational metadata
#   • ClickHouse       — trace/span analytics storage
#   • Redis            — OTEL ingestion queue
#   • MinIO            — event blob buffering for ingestion

x-langfuse-common-env: &langfuse-common-env
  DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
  NEXTAUTH_URL: http://localhost:3001
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: "langfuse_ch"
  REDIS_HOST: "langfuse-redis"
  REDIS_PORT: "6379"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse_minio"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "langfuse_minio_secret"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"

services:
  # PostgreSQL — relational metadata (projects, users, prompts, configs).
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ClickHouse — columnar store for all trace/span/event analytics (v3+).
  # user 101:101 is the clickhouse OS user in the official image; required
  # for correct ownership of the bind-mounted data/log volumes.
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: langfuse_ch
      TZ: UTC
    volumes:
      - langfuse_chdata:/var/lib/clickhouse
      - langfuse_chlogs:/var/log/clickhouse-server
    configs:
      - source: clickhouse-single-node
        target: /etc/clickhouse-server/config.d/single-node.xml
      - source: clickhouse-users
        target: /etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis — async task queue for the OTEL ingestion pipeline (v3+).
  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.langfuse
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${REDIS_AUTH}" --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO — local S3-compatible blob store (required by LangFuse v3+).
  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: langfuse_minio
      MINIO_ROOT_PASSWORD: langfuse_minio_secret
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container: creates the "langfuse" bucket in MinIO.
  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://langfuse-minio:9000 langfuse_minio langfuse_minio_secret &&
      mc mb --ignore-existing local/langfuse &&
      exit 0
      "
    restart: on-failure

  # LangFuse web app — UI + API. Seeds LANGFUSE_INIT_* on first startup.
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    env_file:
      - .env.langfuse
    environment:
      <<: *langfuse-common-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # LangFuse worker — consumes the OTEL ingestion queue into ClickHouse/Postgres.
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.langfuse
    environment:
      <<: *langfuse-common-env

volumes:
  langfuse_pgdata:
    name: autoinsight_langfuse_pgdata
  # ClickHouse data and logs — both removed on langfuse-reset.
  langfuse_chdata:
    name: autoinsight_langfuse_chdata
  langfuse_chlogs:
    name: autoinsight_langfuse_chlogs
  # MinIO blob data — removed on langfuse-reset.
  langfuse_minio:
    name: autoinsight_langfuse_minio

# ── ClickHouse single-node configuration ─────────────────────────────────
# Docker Compose injects these as named configs (read-only files) into the
# ClickHouse container.  No separate config files in the repo are needed.
configs:
  # Enables the built-in ClickHouse Keeper (drop-in ZooKeeper replacement)
  # and sets the macros required for ReplicatedMergeTree on a single node.
  clickhouse-single-node:
    content: |
      <clickhouse>
          <logger>
              <level>warning</level>
              <console>true</console>
          </logger>
          <keeper_server>
              <tcp_port>9181</tcp_port>
              <server_id>1</server_id>
              <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
              <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
              <coordination_settings>
                  <operation_timeout_ms>10000</operation_timeout_ms>
                  <session_timeout_ms>30000</session_timeout_ms>
                  <raft_logs_level>warning</raft_logs_level>
              </coordination_settings>
              <raft_configuration>
                  <server>
                      <id>1</id>
                      <hostname>localhost</hostname>
                      <port>9234</port>
                  </server>
              </raft_configuration>
          </keeper_server>
          <zookeeper>
              <node>
                  <host>localhost</host>
                  <port>9181</port>
              </node>
          </zookeeper>
          <macros>
              <shard>01</shard>
              <replica>01</replica>
          </macros>
      </clickhouse>
  # Disable slow query logging to keep ClickHouse lean for development.
  clickhouse-users:
    content: |
      <clickhouse>
          <profiles>
              <default>
                  <log_queries>0</log_queries>
                  <log_query_threads>0</log_query_threads>
              </default>
          </profiles>
      </clickhouse>
